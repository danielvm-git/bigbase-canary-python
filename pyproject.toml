[project]
name = "bigbase-canary-python"
version = "0.1.1"
description = "Minimal Python canary proving big-release + bigbase-deploy interop"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
]

[project.scripts]
bigbase-canary-python = "bigbase_canary_python.app:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bigbase_canary_python"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
